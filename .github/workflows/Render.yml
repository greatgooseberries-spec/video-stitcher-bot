name: Batch Scene Renderer
on:
  workflow_dispatch:
    inputs:
      scenes_json:
        description: 'JSON array of scene objects to render in this batch'
        required: true
      output_folder_id:
        description: 'Google Drive folder ID to upload the finished part video to'
        required: true
        default: '1G9Gmc-VeAzy13bAO95xW9go7Z43R-HAA'
      part_name:
        description: 'Filename (no extension) for the finished part, e.g. part_0000_0019'
        required: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies & FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install moviepy==1.0.3 imageio_ffmpeg requests Pillow==9.5.0 numpy google-api-python-client google-auth
    - name: Run Batch Render Script
      env:
        SCENES_JSON: ${{ github.event.inputs.scenes_json }}
        OUTPUT_FOLDER_ID: ${{ github.event.inputs.output_folder_id }}
        PART_NAME: ${{ github.event.inputs.part_name }}
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python render.py
