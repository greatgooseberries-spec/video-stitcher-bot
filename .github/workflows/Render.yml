name: Batch Scene Renderer

on:
  workflow_dispatch:
    inputs:
      scenes_json:
        description: 'JSON array of scene objects to render in this batch'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies & FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install moviepy==1.0.3 imageio_ffmpeg requests Pillow==9.5.0 numpy google-api-python-client google-auth
    - name: Run Batch Render Script
      env:
        SCENES_JSON: ${{ github.event.inputs.scenes_json }}
        OUTPUT_FOLDER_ID: '1G9Gmc-VeAzy13bAO95xW9go7Z43R-HAA'
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python Render.py
