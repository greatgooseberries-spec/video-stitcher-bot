name: Render Video From Scenes

on:
  repository_dispatch:
    types: [render_video_job]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install requests pillow google-auth google-api-python-client

      - name: Render video
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          OUTPUT_FILENAME: ${{ github.event.client_payload.output_filename }}
          MASTER_AUDIO_URL: ${{ github.event.client_payload.master_audio_url }}
          CALLBACK_WEBHOOK_URL: ${{ github.event.client_payload.callback_webhook_url }}
          SCENES_JSON_URL: ${{ github.event.client_payload.scenes_json_url }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}
        run: python render_scenes.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-failure-workdir
          path: work/
          retention-days: 3[cite: 1]
